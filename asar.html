<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23163767%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Georgia,serif%27 font-size=%2720%27 font-weight=%27700%27 fill=%27%23c99a3a%27 text-anchor=%27middle%27%3EM%3C/text%3E%3C/svg%3E">
  <script>document.documentElement.classList.add('js')</script>
  <title data-i18n="title.shaxslar">MEROS</title>
  <meta name="description" content="">
</head>
<body data-page="asar">
  <header id="site-header"></header>
  <main>
    <div class="wrap">
      <nav class="crumbs" id="crumbs"></nav>
      <div class="reader-head load-in" id="reader-head"></div>
      <div class="reader-wrap">
        <div>
          <div class="reader-summary rv" id="reader-summary"></div>
          <div id="reader-body"></div>
        </div>
        <aside class="reader-side" id="reader-side"></aside>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script>
  (function () {
    var l = new URLSearchParams(location.search).get("lang");
    if (!l) { try { l = localStorage.getItem("meros-lang"); } catch (e) {} }
    var s = ["js/data.js", "js/i18n.js"];
    if (l === "ru") s.push("js/people-ru.js");
    if (l === "en") s.push("js/people-en.js");
    s.push("js/works.js");
    if (/(index|asar)\.html$|\/$/.test(location.pathname)) s.push("js/audio.js");
    s.push("js/app.js");
    s.forEach(function (src) { var e = document.createElement("script"); e.src = src; e.async = false; document.body.appendChild(e); });
  })();
  </script>
</body>
</html>
