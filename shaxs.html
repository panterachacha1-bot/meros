<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%231d1a14%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Georgia,serif%27 font-size=%2720%27 font-weight=%27700%27 fill=%27%23f6f0e4%27 text-anchor=%27middle%27%3EM%3C/text%3E%3C/svg%3E">
  <script>document.documentElement.classList.add('js')</script>
  <title data-i18n="title.shaxslar">MEROS</title>
  <meta name="description" content="">
</head>
<body data-page="shaxs">
  <header id="site-header"></header>
  <main>
    <div class="wrap">
      <nav class="crumbs" id="crumbs"></nav>
      <div class="person-head" id="person-head"></div>
      <section class="journey" id="journey"></section>
      <section class="top-works" id="top-works"></section>
      <div class="person-body">
        <div class="person-main">
          <div id="quote-wrap"></div>
          <section class="rv"><div class="block-title"><h2 class="h3" data-i18n="person.bio">Hayoti va faoliyati</h2></div><div class="prose" id="bio"></div></section>
          <section class="rv"><div class="block-title"><h2 class="h3" data-i18n="person.timeline">Xronologiya</h2></div><div id="timeline"></div></section>
          <section class="rv"><div class="block-title"><h2 class="h3" data-i18n="person.allWorks">Barcha asarlari</h2></div><div id="works"></div></section>
          <section class="keypoints rv" id="keypoints"></section>
        </div>
        <aside class="person-side">
          <div><h3 class="label" style="margin-bottom:6px" data-i18n="person.brief">Qisqacha</h3><div id="facts"></div></div>
          <div><h3 class="label" style="margin-bottom:6px" data-i18n="person.related">Bogʻliq siymolar</h3><div id="related"></div></div>
          <div class="side-actions" id="side-actions"></div>
        </aside>
      </div>
      <nav class="pager" id="pager"></nav>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script>
  (function () {
    var l = new URLSearchParams(location.search).get("lang");
    if (!l) { try { l = localStorage.getItem("meros-lang"); } catch (e) {} }
    var s = ["js/data.js", "js/i18n.js"];
    if (l === "ru") s.push("js/people-ru.js");
    if (l === "en") s.push("js/people-en.js");
    s.push("js/works.js");
    if (/(index|asar)\.html$|\/$/.test(location.pathname)) s.push("js/audio.js");
    s.push("js/app.js");
    s.forEach(function (src) { var e = document.createElement("script"); e.src = src; e.async = false; document.body.appendChild(e); });
  })();
  </script>
</body>
</html>
